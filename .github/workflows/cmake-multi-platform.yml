name: CMake multi-platform

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      os:
        description: "Operating system to build (or all)"
        required: true
        type: choice
        options:
          - all
          - macOS
          - Linux
          - Windows
        default: all
      version:
        description: "Release tag (e.g. v0.1.0). Leave empty for auto-generated tag."
        required: false
        type: string
        default: ""
      publish:
        description: "Mark the release production-ready"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set matrix
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" != "workflow_dispatch" || "${{ github.event.inputs.os }}" == "all" ]]; then
            echo 'matrix={"include":[{"name":"macOS","os":"macos-15"},{"name":"Linux","os":"ubuntu-24.04"},{"name":"Windows","os":"windows-2022"}]}' >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.inputs.os }}" in
              macOS)
                echo 'matrix={"include":[{"name":"macOS","os":"macos-15"}]}' >> "$GITHUB_OUTPUT"
                ;;
              Linux)
                echo 'matrix={"include":[{"name":"Linux","os":"ubuntu-24.04"}]}' >> "$GITHUB_OUTPUT"
                ;;
              Windows)
                echo 'matrix={"include":[{"name":"Windows","os":"windows-2022"}]}' >> "$GITHUB_OUTPUT"
                ;;
            esac
          fi

  build:
    name: ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install cmake sdl3 freetype curl

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libfreetype-dev libcurl4-openssl-dev libvulkan-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxss-dev libxtst-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdecor-0-dev libpipewire-0.3-dev libv4l-dev

      - name: Build SDL3 on Linux
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/SDL3.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.0/SDL3-3.4.0.tar.gz
          tar -xzf /tmp/SDL3.tar.gz -C /tmp
          cmake -S /tmp/SDL3-3.4.0 -B /tmp/sdl3-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF
          cmake --build /tmp/sdl3-build --parallel
          sudo cmake --install /tmp/sdl3-build
          sudo ldconfig
          find /usr/local -name SDL3Config.cmake -print
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig \
            pkg-config --modversion sdl3

      - name: Configure (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/local/share/pkgconfig
        run: |
          extra=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            extra+=("-DCMAKE_PREFIX_PATH=$(brew --prefix)")
          else
            extra+=("-DCMAKE_PREFIX_PATH=/usr/local")
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCELLSCOPE_BUILD_TESTS=ON \
            "${extra[@]}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = "C:\vcpkg" }
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCELLSCOPE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/cellscope.app dist/CellScope-macos-arm64.zip

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/CellScope-linux-x86_64.tar.gz \
            -C build cellscope assets scripts third_party

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "build/Release/*" -DestinationPath "dist/CellScope-windows-x64.zip"

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: cellscope-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: find dist -maxdepth 2 -type f -print

      - name: Set build timestamp
        id: build_time
        run: echo "value=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Compose release notes
        env:
          PUBLISH: ${{ inputs.publish }}
          OS_INPUT: ${{ inputs.os || 'all' }}
          BUILT_AT: ${{ steps.build_time.outputs.value }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            status="Production ready."
          else
            status="Non-production ready."
          fi
          {
            printf '**%s**\n\n' "$status"
            printf 'Automated multi-platform production build of CellScope.\n\n'
            printf 'Built at %s for:\n\n' "$BUILT_AT"
            case "$OS_INPUT" in
              macOS) printf -- '- Mac OS (Apple silicon)\n' ;;
              Linux) printf -- '- Linux x86_64\n' ;;
              Windows) printf -- '- Windows x86_64\n' ;;
              *) printf -- '- Mac OS (Apple silicon)\n- Linux x86_64\n- Windows x86_64\n' ;;
            esac
          } > release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.event.inputs.version || format('v0.1.0-build.{0}', github.run_number) }}
          name: CellScope ${{ github.event.inputs.version || 'v0.1.0' }}
          body_path: release-notes.md
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}