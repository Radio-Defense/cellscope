name: CMake multi-platform

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022

    steps:
      - name: Check out sources
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install cmake sdl3 freetype curl

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libfreetype-dev libcurl4-openssl-dev libvulkan-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxinerama-dev libxss-dev libxtst-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libdecor-0-dev libpipewire-0.3-dev libv4l-dev

      - name: Build SDL3 on Linux
        if: runner.os == 'Linux'
        run: |
          curl -fsSL -o /tmp/SDL3.tar.gz \
            https://github.com/libsdl-org/SDL/releases/download/release-3.4.0/SDL3-3.4.0.tar.gz
          tar -xzf /tmp/SDL3.tar.gz -C /tmp
          cmake -S /tmp/SDL3-3.4.0 -B /tmp/sdl3-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF
          cmake --build /tmp/sdl3-build --parallel
          sudo cmake --install /tmp/sdl3-build
          sudo ldconfig
          find /usr/local -name SDL3Config.cmake -print
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig \
            pkg-config --modversion sdl3

      - name: Configure (macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig:/usr/local/share/pkgconfig
        run: |
          extra=()
          if [ "$RUNNER_OS" = "macOS" ]; then
            extra+=("-DCMAKE_PREFIX_PATH=$(brew --prefix)")
          else
            extra+=("-DCMAKE_PREFIX_PATH=/usr/local")
          fi
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCELLSCOPE_BUILD_TESTS=ON \
            "${extra[@]}"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkg) { $vcpkg = "C:\vcpkg" }
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCELLSCOPE_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            build/cellscope.app dist/CellScope-macos-arm64.zip

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          tar -czf dist/CellScope-linux-x86_64.tar.gz \
            -C build cellscope assets scripts third_party

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/Release/* \
            -DestinationPath dist/CellScope-windows-x64.zip

      - name: Upload packaged build
        uses: actions/upload-artifact@v4
        with:
          name: cellscope-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Download platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List release files
        run: find dist -maxdepth 2 -type f -print

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v0.2.0-build.${{ github.run_number }}
          name: CellScope v0.2.0 build ${{ github.run_number }}
          body: |
            Automated multi-platform build of CellScope.

            Assets:
            - macOS (Apple silicon) application bundle
            - Linux x86_64 executable and runtime assets
            - Windows x64 executable and runtime assets

            The Python reader runtime is downloaded on first launch.
          files: dist/*
          fail_on_unmatched_files: true
          prerelease: true
          generate_release_notes: true
